<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notebook Engine | FastAPI CRUD Platform</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="brand">
                <div class="brand-icon">⚡</div>
                <div class="brand-text">
                    <h1>Notebook Platform</h1>
                    <p>FastAPI REST Engine & CRUD Operations</p>
                </div>
            </div>
            <div class="header-actions">
                <span class="port-badge">PORT :8009</span>
                <a href="http://localhost:8008" target="_blank" class="agent-link-btn">
                    <span>🤖 Open AI Agent (:8008)</span>
                    <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                </a>
            </div>
        </header>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(99, 102, 241, 0.15); color: #818cf8;">📚</div>
                <div class="stat-info">
                    <h3 id="statTotal">0</h3>
                    <p>Total Notebooks</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(16, 185, 129, 0.15); color: #34d399;">🏷️</div>
                <div class="stat-info">
                    <h3 id="statCategories">0</h3>
                    <p>Active Categories</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(6, 182, 212, 0.15); color: #38bdf8;">⚙️</div>
                <div class="stat-info">
                    <h3>FastAPI Engine</h3>
                    <p>Port 8009 Active</p>
                </div>
            </div>
        </div>

        <!-- Controls Bar -->
        <div class="controls-bar">
            <div class="search-filter-group">
                <div class="search-box">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    <input type="text" id="searchInput" placeholder="Search notebooks by title, content or tags...">
                </div>
                <select id="categoryFilter" class="category-select">
                    <option value="All">All Categories</option>
                </select>
            </div>
            <button class="btn btn-primary" id="btnNewNotebook">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                <span>New Notebook</span>
            </button>
        </div>

        <!-- Notebooks Grid -->
        <div class="notebooks-grid" id="notebooksGrid">
            <!-- Rendered dynamically -->
        </div>
    </div>

    <!-- Create / Edit Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Create New Notebook</h2>
                <button class="icon-btn" id="btnCloseModal">✕</button>
            </div>
            <form id="notebookForm">
                <div class="form-group">
                    <label for="fieldTitle">Notebook Title *</label>
                    <input type="text" id="fieldTitle" placeholder="e.g. System Architecture Design" required>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                    <div class="form-group">
                        <label for="fieldCategory">Category</label>
                        <input type="text" id="fieldCategory" placeholder="e.g. Work, Ideas, Study" value="General">
                    </div>
                    <div class="form-group">
                        <label for="fieldTags">Tags (comma separated)</label>
                        <input type="text" id="fieldTags" placeholder="e.g. architecture, fastapi, v1">
                    </div>
                </div>
                <div class="form-group">
                    <label for="fieldContent">Content Body *</label>
                    <textarea id="fieldContent" rows="6" placeholder="Write your note body content here..." required></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="btnCancelModal">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="btnSaveNotebook">Save Notebook</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notifications Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="/static/js/app.js"></script>
</body>
</html>
